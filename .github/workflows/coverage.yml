name: Coverage and SonarQube

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest coverage
      - name: Run tests with coverage
        run: |
          python -m coverage run --source=. --omit='tests/*' -m pytest -q --junitxml=test-results.xml
          python -m coverage xml -o coverage.xml
      - name: Verify SonarQube reports
        run: |
          test -s coverage.xml
          test -s test-results.xml
      - name: Require SonarQube Cloud token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Missing SONAR_TOKEN repository secret; coverage cannot be published."
            exit 1
          fi
      - name: Run SonarQube Cloud analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_attempt }}
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: error
